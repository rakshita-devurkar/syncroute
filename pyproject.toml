[project]
name = "syncroute"
version = "0.1.0"
description = "Routes synthetic data-sync failures to simulated recovery workflows using deterministic rules plus a Jev System One classifier."
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.40",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
syncroute = "syncroute.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syncroute"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: hits the real TypeSafe API; opt in with -m live"]
addopts = "-m 'not live'"
